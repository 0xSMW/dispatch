name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:prod
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Require verified home-server usage for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          USAGE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/usage/status.mjs
