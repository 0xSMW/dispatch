name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm typecheck

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical production vulnerabilities block verification. The audit script
      # contains one exact, path-qualified exception for an unpatched optional Workflow build path.
      - run: pnpm audit:prod

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: dispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AWS_REGION: us-west-2
      SES_PROVIDER: fake
      STORAGE_BACKEND: local
      TEST_DATABASE_URL: postgres://dispatch:integration@127.0.0.1:5432/dispatch_test
      TEST_REDIS_URL: redis://127.0.0.1:6379
      REQUIRE_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate disposable test secrets
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_ENV"
          import { randomBytes } from 'node:crypto';
          for (const name of ['APP_SECRET', 'API_KEY_PEPPER']) {
            console.log(`${name}=${randomBytes(32).toString('hex')}`);
          }
          JS
      - name: Test security against Postgres and Redis
        run: pnpm exec vitest run apps/api/src/accept.test.ts --testTimeout 30000 --hookTimeout 60000
